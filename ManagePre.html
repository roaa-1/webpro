<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Prerequisites</title>

<link rel="stylesheet" href="assets/CSS/ManagePre.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div class="header">
    <h2> Manage Prerequisites</h2>
</div>

<div class="container">

    
    <div class="card">

        <h3> Add Prerequisite</h3>

        <select id="targetCourse"></select>
        <select id="prereqCourse"></select>

        <div class="error" id="errorBox"></div>

        <button onclick="addPrereq()">
            <i class="fa-solid fa-plus"></i> Add
        </button>

    </div>

   
    <div class="card">

        <h3></i> Course Prerequisites</h3>

        <div id="list"></div>

    </div>

</div>

<div id="toast"></div>

<script src="assets/JS/ManagePre.js"></script>

</body>
</html>
