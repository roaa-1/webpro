<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Listing</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/CSS/CourseListing.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar">

            <div class="logo mb-4">
                <div class="icon-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span>نظام التسجيل الجامعي</span>
            </div>

            <hr>

            <ul>
                <li>
                    <i class="fa-solid fa-sliders"></i>
                    <a href="StudentDashboard.html">لوحة التحكم</a>
                </li>

                <li class="active">
                    <i class="fa-solid fa-book-open"></i>
                    <a href="CourseListing.html">المساقات المتاحة</a>
                </li>

                <li>
                    <i class="fa-regular fa-clipboard"></i>
                    <a href="RegistredCourse.html">مساقاتي المسجلة</a>
                </li>
            </ul>

            <div class="logout">
                <i class="fa-solid fa-right-from-bracket logout-icon"></i>
                تسجيل الخروج
            </div>

        </div>

        <div class="col-md-10 content p-4">

            <h4>المساقات المتاحة</h4>
            <p>استعرض المساقات المتاحة للتسجيل في هذا الفصل</p>

            <div class="search-box mb-4">
                <input type="text" class="form-control"
                       placeholder="البحث عن مساق (رمز المساق أو العنوان)...">
            </div>

            <div class="table-box">

                <h6 class="mb-3">قائمة المساقات</h6>

                <table class="table text-center align-middle">

                    <thead>
                    <tr>
                        <th>رمز المساق</th>
                        <th>اسم المساق</th>
                        <th>السعة</th>
                        <th>المتطلبات السابقة</th>
                        <th>الإجراء</th>
                    </tr>
                    </thead>


                    <tbody id="coursesTable"></tbody>

                </table>

            </div>

        </div>

    </div>
</div>

<script src="assets/JS/CourseListing.js"></script>

</body>
</html>
