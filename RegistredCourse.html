<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Course</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/CSS/RegistredCourse.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar">
            <div class="logo mb-4">
                <div class="icon-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span>نظام التسجيل الجامعي</span>
            </div>

            <hr>

            <ul>
                <li><a href="StudentDashboard.html">لوحة التحكم</a></li>
                <li><a href="CourseListing.html">المساقات المتاحة</a></li>
                <li class="active"><a href="RegistredCourse.html">مساقاتي</a></li>
            </ul>

            <div class="logout">
                <i class="fa-solid fa-right-from-bracket logout-icon"></i>
                تسجيل الخروج
            </div>
        </div>

        <div class="col-md-10 content">

            <div class="top-title">
                <h1>مساقاتي المسجلة</h1>
                <p>إجمالي الساعات المسجلة: 0 ساعة معتمدة</p>
            </div>

            <div class="stats">
                <div class="card">
                    <h2 id="courseCount">0</h2>
                    <span>عدد المساقات</span>
                </div>

                <div class="card">
                    <h2 id="totalHours">0</h2>
                    <span>الساعات المعتمدة</span>
                </div>

                <div class="card">
                    <h2>18</h2>
                    <span>الحد الأقصى</span>
                </div>
            </div>

            <div class="table-box">
                <h2 class="table-title">المساقات المسجلة</h2>

                <table>
                    <thead>
                    <tr>
                        <th>رمز المساق</th>
                        <th>اسم المساق</th>
                        <th>الساعات</th>
                        <th>الإجراء</th>
                    </tr>
                    </thead>

                    <tbody id="coursesTable"></tbody>

                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./assets/JS/RegisteredCourse.js"></script>

</body>

</html>
